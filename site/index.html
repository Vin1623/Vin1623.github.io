<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincent Tan · Electrical Engineering Portfolio</title>
  <meta name="description" content="PCB design and hardware portfolio of Vincent Tan, Electrical Engineering student at Stony Brook University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="dot"></span><span id="brand-name"></span></a>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
      <a id="nav-resume" class="btn-sm" href="#" hidden>Resume</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="mono kicker">// hardware portfolio</p>
      <h1 id="hero-name"></h1>
      <p class="tagline" id="hero-tagline"></p>
      <p class="school mono" id="hero-school"></p>
      <p class="about" id="hero-about"></p>
      <div class="hero-links" id="hero-links"></div>
    </section>

    <section id="projects">
      <div class="section-head">
        <h2>Projects</h2>
        <span class="mono muted">schematics · 3D boards · bring-up notes</span>
      </div>
      <div class="grid" id="project-grid"></div>
    </section>

    <section id="skills">
      <div class="section-head"><h2>Skills</h2></div>
      <div class="skills" id="skills-list"></div>
    </section>

    <section id="contact">
      <div class="section-head"><h2>Contact</h2></div>
      <div class="hero-links" id="contact-links"></div>
    </section>
  </main>

  <footer class="mono muted" id="footer"></footer>

  <script src="js/site.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
